[project]
name = "txbar"
version = "0.1.0"
description = "Texas Bar attorney enrichment pipeline with identity resolution and human-in-the-loop review."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "polars>=1.9",
    "rapidfuzz>=3.9",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "google-cloud-bigquery>=3.25",
    "google-cloud-storage>=2.18",
]

[dependency-groups]
dev = ["pytest>=8.3", "respx>=0.21", "ruff>=0.6"]

[project.scripts]
txbar = "txbar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/txbar"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "E501", "B904", "SIM102"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
